name: regumate-offline

services:
  db-init:
    image: ${REGUMATE_APP_IMAGE:-regumate/app:contest-v3-amd64}
    platform: linux/amd64
    network_mode: none
    entrypoint: ["python", "/offline/restore_db.py"]
    volumes:
      - ./scripts/offline:/offline:ro
      - ./data/offline_seed:/seed:ro
      - regumate_db:/app/db_runtime
    restart: "no"

  qdrant:
    image: qdrant/qdrant:v1.18.0
    platform: linux/amd64
    entrypoint: ["sh", "/offline/start_qdrant.sh"]
    environment:
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-regumate_chunks}
    volumes:
      - ./scripts/offline:/offline:ro
      - ./data/offline_seed:/seed:ro
      - regumate_qdrant:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q 'healthz check passed' <&3"]
      interval: 10s
      timeout: 3s
      retries: 60
      start_period: 120s

  qdrant-init:
    image: ${REGUMATE_APP_IMAGE:-regumate/app:contest-v3-amd64}
    platform: linux/amd64
    depends_on:
      qdrant:
        condition: service_healthy
    entrypoint: ["python", "/offline/initialize_qdrant.py"]
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-regumate_chunks}
    volumes:
      - ./scripts/offline:/offline:ro
    restart: "no"

  app:
    image: ${REGUMATE_APP_IMAGE:-regumate/app:contest-v3-amd64}
    platform: linux/amd64
    depends_on:
      db-init:
        condition: service_completed_successfully
      qdrant-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    environment:
      SERVICE_PORT: ${SERVICE_PORT:-8000}
      UVICORN_WORKERS: 1
      REGUMATE_DATA_DIR: /app/data/evaluation/final_runtime
      REGUMATE_DB_DIR: /app/db_runtime
      REGUMATE_MODEL_CACHE_DIR: /app/data/model_cache
      REGUMATE_OFFLINE_MODE: "true"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      EMBEDDING_MODEL_PATH: /app/data/models/bge-m3
      RERANKER_MODEL_PATH: /app/data/models/bge-reranker-v2-m3
      MODEL_DEVICE: ${MODEL_DEVICE:-cpu}
      MODEL_BACKEND: pytorch
      MODEL_WARMUP_POLICY: background
      REGUMATE_PERFORMANCE_MODE: auto
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-8}
      EMBEDDING_MAX_BATCH_SIZE: ${EMBEDDING_MAX_BATCH_SIZE:-16}
      RERANK_BATCH_SIZE: ${RERANK_BATCH_SIZE:-16}
      RERANK_MAX_LENGTH: ${RERANK_MAX_LENGTH:-1024}
      RERANK_INPUT_MODE: embedding
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-regumate_chunks}
      QDRANT_AUTO_CREATE_COLLECTION: "true"
      MODEL_PROVIDER: ${MODEL_PROVIDER:-DeepSeek}
      LLM_PROVIDER: openai_compatible
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.deepseek.com}
      MODEL_NAME: ${MODEL_NAME:-deepseek-v4-flash}
      LLM_RESPONSE_FORMAT: ${LLM_RESPONSE_FORMAT:-json_object}
      LLM_DISABLE_THINKING: ${LLM_DISABLE_THINKING:-false}
      SEMANTIC_GROUNDING_MODE: ${SEMANTIC_GROUNDING_MODE:-risk_based}
      ANSWER_GENERATION_TIMEOUT_SECONDS: ${ANSWER_GENERATION_TIMEOUT_SECONDS:-15}
      ANSWER_GENERATION_MAX_TOKENS: ${ANSWER_GENERATION_MAX_TOKENS:-4500}
      QA_REQUEST_TOTAL_BUDGET_SECONDS: ${QA_REQUEST_TOTAL_BUDGET_SECONDS:-300}
      QA_COMPLEX_REQUEST_TOTAL_BUDGET_SECONDS: ${QA_COMPLEX_REQUEST_TOTAL_BUDGET_SECONDS:-600}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: localhost,127.0.0.1,qdrant,::1
    ports:
      - "${REGUMATE_BIND_ADDRESS:-0.0.0.0}:${SERVICE_PORT:-8000}:${SERVICE_PORT:-8000}"
    volumes:
      - ./data:/app/data
      - ./data/models:/app/data/models:ro
      - regumate_db:/app/db_runtime
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${SERVICE_PORT:-8000}/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

volumes:
  regumate_db:
  regumate_qdrant:
