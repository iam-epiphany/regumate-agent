services:
  app:
    image: ${REGUMATE_APP_IMAGE:-regumate/app:contest-v3}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REGUMATE_BUILD_ID: ${REGUMATE_BUILD_ID:-dev}
        REGUMATE_TORCH_FLAVOR: ${REGUMATE_TORCH_FLAVOR:-cuda}
    container_name: regumate-app
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      REGUMATE_DATA_DIR: /app/data/evaluation/final_runtime
      REGUMATE_DB_DIR: /app/db_runtime
      REGUMATE_MODEL_CACHE_DIR: /app/data/model_cache
      REGUMATE_OFFLINE_MODE: ${REGUMATE_OFFLINE_MODE:-false}
      # 代理默认关闭（空值=直连），新手环境开箱即用。仅在需要经宿主
      # 代理出站的环境（如本机 WSL2 出站受限）通过 .env 设置：
      #   REGUMATE_HTTP_PROXY=http://host.docker.internal:7890
      #   REGUMATE_HTTPS_PROXY=http://host.docker.internal:7890
      HTTP_PROXY: ${REGUMATE_HTTP_PROXY:-}
      HTTPS_PROXY: ${REGUMATE_HTTPS_PROXY:-}
      NO_PROXY: ${REGUMATE_NO_PROXY:-localhost,127.0.0.1,qdrant,::1}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
      REGUMATE_BUILD_ID: ${REGUMATE_BUILD_ID:-dev}
      SEMANTIC_GROUNDING_MODE: ${SEMANTIC_GROUNDING_MODE:-risk_based}
      SEMANTIC_GROUNDING_MODEL: ${SEMANTIC_GROUNDING_MODEL:-deepseek-v4-flash}
      SEMANTIC_GROUNDING_TIMEOUT_SECONDS: ${SEMANTIC_GROUNDING_TIMEOUT_SECONDS:-12}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-regumate_chunks}
      QDRANT_AUTO_CREATE_COLLECTION: ${QDRANT_AUTO_CREATE_COLLECTION:-true}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      LLM_RESPONSE_FORMAT: ${LLM_RESPONSE_FORMAT:-json_object}
      LLM_STREAM: ${LLM_STREAM:-true}
      LLM_DISABLE_THINKING: ${LLM_DISABLE_THINKING:-false}
      QUERY_PLANNER_MODEL: ${QUERY_PLANNER_MODEL:-deepseek-v4-flash}
      ANSWER_GENERATION_MODEL: ${ANSWER_GENERATION_MODEL:-deepseek-v4-flash}
      ANSWER_GENERATION_TIMEOUT_SECONDS: ${ANSWER_GENERATION_TIMEOUT_SECONDS:-15}
      ANSWER_GENERATION_MAX_ATTEMPTS: ${ANSWER_GENERATION_MAX_ATTEMPTS:-8}
      ANSWER_GENERATION_TOTAL_BUDGET_SECONDS: ${ANSWER_GENERATION_TOTAL_BUDGET_SECONDS:-100}
      ANSWER_GENERATION_MAX_TOKENS: ${ANSWER_GENERATION_MAX_TOKENS:-4500}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-8}
      EMBEDDING_MAX_BATCH_SIZE: ${EMBEDDING_MAX_BATCH_SIZE:-16}
      REGUMATE_PERFORMANCE_MODE: ${REGUMATE_PERFORMANCE_MODE:-auto}
      MODEL_BACKEND: ${MODEL_BACKEND:-pytorch}
      MODEL_WARMUP_POLICY: ${MODEL_WARMUP_POLICY:-background}
      RERANK_BATCH_SIZE: ${RERANK_BATCH_SIZE:-16}
      RERANK_MAX_LENGTH: ${RERANK_MAX_LENGTH:-1024}
      RERANK_INPUT_MODE: ${RERANK_INPUT_MODE:-embedding}
      TORCH_NUM_THREADS: ${TORCH_NUM_THREADS:-0}
      TORCH_NUM_INTEROP_THREADS: ${TORCH_NUM_INTEROP_THREADS:-0}
      QUERY_EMBEDDING_CACHE_BYTES: ${QUERY_EMBEDDING_CACHE_BYTES:-67108864}
      RERANK_SCORE_CACHE_BYTES: ${RERANK_SCORE_CACHE_BYTES:-33554432}
      MODEL_DEVICE: ${MODEL_DEVICE:-cuda}
      MODEL_GPU_MIN_FREE_MEMORY_GB: ${MODEL_GPU_MIN_FREE_MEMORY_GB:-1.0}
      MAX_PROMPT_TOKENS: ${MAX_PROMPT_TOKENS:-3600}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      INDEX_QUEUE_CAPACITY: ${INDEX_QUEUE_CAPACITY:-8}
      INDEX_TASK_MAX_RETRIES: ${INDEX_TASK_MAX_RETRIES:-3}
      QA_QUEUE_CAPACITY: ${QA_QUEUE_CAPACITY:-16}
      QA_TASK_MAX_RETRIES: ${QA_TASK_MAX_RETRIES:-1}
      MAX_OOXML_ENTRIES: ${MAX_OOXML_ENTRIES:-20000}
      MAX_OOXML_UNCOMPRESSED_BYTES: ${MAX_OOXML_UNCOMPRESSED_BYTES:-524288000}
      MAX_SPREADSHEET_LOGICAL_CELLS: ${MAX_SPREADSHEET_LOGICAL_CELLS:-5000000}
      OFFICE_CONVERSION_TIMEOUT_SECONDS: ${OFFICE_CONVERSION_TIMEOUT_SECONDS:-120}
      OFFICE_CONVERSION_MAX_BYTES: ${OFFICE_CONVERSION_MAX_BYTES:-209715200}
      HF_HOME: /app/data/model_cache/huggingface
      HF_HUB_CACHE: /app/data/model_cache/huggingface/hub
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      # 模型下载走 HuggingFace 国内镜像（无需代理）；需要直连官方时在 .env 覆盖：
      #   HF_ENDPOINT=https://huggingface.co
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-0}
      HF_DATASETS_OFFLINE: ${HF_DATASETS_OFFLINE:-0}
      SENTENCE_TRANSFORMERS_HOME: /app/data/model_cache/sentence_transformers
      TORCH_HOME: /app/data/model_cache/torch
      EMBEDDING_MODEL_PATH: ${EMBEDDING_MODEL_PATH:-}
      RERANKER_MODEL_PATH: ${RERANKER_MODEL_PATH:-}
    ports:
      - "127.0.0.1:${REGUMATE_APP_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - regumate_db:/app/db_runtime
      - ./data/models:/app/data/models:ro
    restart: unless-stopped
    healthcheck:
      # /api/health 为存活检查；/api/health/ready 需要知识库已导入数据，
      # 首次导入资料前会 503，不能用于容器健康门禁。
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: regumate-qdrant
    ports:
      - "127.0.0.1:${REGUMATE_QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${REGUMATE_QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q 'healthz check passed' <&3"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  regumate_db:

networks:
  default:
    driver: bridge
    driver_opts:
      # 容器出站 TLS 大包在宿主网络路径上可能被丢弃（SSL_ERROR_SYSCALL /
      # UNEXPECTED_EOF），表现为 LLM API 全部失败。调小容器网络 MTU 避免丢包。
      com.docker.network.driver.mtu: "1350"
