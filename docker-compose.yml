services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: regumate-app
    depends_on:
      qdrant:
        condition: service_started
    environment:
      REGUMATE_DATA_DIR: /app/data
      REGUMATE_MODEL_CACHE_DIR: /app/data/model_cache
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: regumate_chunks
      HF_HOME: /app/data/model_cache/huggingface
      HF_HUB_CACHE: /app/data/model_cache/huggingface/hub
      SENTENCE_TRANSFORMERS_HOME: /app/data/model_cache/sentence_transformers
      TORCH_HOME: /app/data/model_cache/torch
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: regumate-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped
